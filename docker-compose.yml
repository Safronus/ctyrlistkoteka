services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ctyrlistkoteka-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctyrlist
      POSTGRES_PASSWORD: ctyrlist_dev
      POSTGRES_DB: ctyrlistkoteka
    # Loopback only. A published port bypasses the host firewall (Docker
    # writes its own rules), so "5432:5432" would put a database with the
    # dev password on every interface of whatever machine runs this —
    # including the VPS, where these containers were once created by mistake
    # (found 2026-10-28, never started).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctyrlist -d ctyrlistkoteka"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ctyrlistkoteka-redis
    restart: unless-stopped
    # Loopback only, same reason — and this Redis has no password.
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]

volumes:
  postgres_data:
