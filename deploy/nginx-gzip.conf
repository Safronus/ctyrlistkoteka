# Komprese odpovědí — http {} kontext.
# Umístění: /etc/nginx/conf.d/ctyrlistkoteka-gzip.conf
# Instalace / aktualizace (viz docs/deployment.md, „Komprese"):
#   sudo install -m 644 /var/www/ctyrlistkoteka/deploy/nginx-gzip.conf /etc/nginx/conf.d/ctyrlistkoteka-gzip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Proč samostatný soubor: Ubuntu má v /etc/nginx/nginx.conf `gzip on;`, ale
# všechno ostatní zakomentované — bez `gzip_types` nginx komprimuje jen
# výchozí text/html, takže JSON z /api, SVG (mapy kontinentů na
# /statistiky) i další typy šly ven nekomprimované (zjištěno 2026-10-28).
# Blok z deploy/nginx.conf.template se do živého vhostu nikdy nedostal.
# Drop-in v conf.d je nejmenší zásah: nesahá na vhost ani na distribuční
# nginx.conf a přežije jejich úpravy.
#
# `gzip on;` tu schválně NENÍ — už je v nginx.conf a duplicitní direktiva
# ve stejném kontextu by `nginx -t` shodila. Platí pro všechny vhosty na
# stroji (GoatCounter, qr.casqb.org…), což je u komprese neškodné.

gzip_vary on;          # Vary: Accept-Encoding, ať cache nemíchají varianty
gzip_proxied any;      # komprimuj i odpovědi na requesty přes proxy (Via)
gzip_comp_level 6;     # rozumný poměr CPU / velikost
gzip_min_length 256;   # drobné odpovědi nemá smysl balit
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    image/x-icon;
